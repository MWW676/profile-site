name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend
        run: |
          gcloud run deploy profile-site-backend \
          --source ./backend \
          --region us-central1 \
          --project ${{ secrets.GCP_PROJECT_ID }} \
          --allow-unauthenticated \
          --set-env-vars "^@^GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}@CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}@UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}@UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}@ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"

      - name: Deploy frontend
        run: |
          gcloud run deploy profile-site-frontend \
            --source ./frontend \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --allow-unauthenticated
