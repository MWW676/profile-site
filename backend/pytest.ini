[pytest]
# Root directory for test discovery
testpaths = tests

# Exclude virtual environments and build directories from test scanning
norecursedirs = .venv .venv-mcp venv build dist *.egg-info

# Custom marker declarations (format: marker_name: description)
markers =
    smoke: Basic tests to quickly verify functionality
    integration: Tests requiring external services or databases
    slow: Long-running performance or end-to-end tests

# Options for execution and coverage reporting
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --strict-markers
    -ra

# Test discovery naming patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*